<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Public API Refresh Example</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #joke-container { margin-top: 15px; font-size: 1.2rem; color: #333; min-height: 50px; }
    button { padding: 10px 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <h1>Random Joke Generator</h1>
  
  <!-- The Refresh Button -->
  <button id="refresh-btn">Refresh Joke</button>

  <div id="joke-container">Click the button to load a joke!</div>

  <script src="script.js"></script>
</body>
</html>
